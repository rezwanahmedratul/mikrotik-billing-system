services:
  postgres:
    image: postgres:16-alpine
    container_name: mikrotik-billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mikrotik_billing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mikrotik_billing}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mikrotik-network

  redis:
    image: redis:7-alpine
    container_name: mikrotik-billing-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - mikrotik-network

  api:
    container_name: mikrotik-billing-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mikrotik_billing}?schema=public
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_development_purposes_only_change_in_production}
      SESSION_SECRET: ${SESSION_SECRET:-super_secret_session_key_for_development_purposes_only}
      ROUTER_MOCK_MODE: ${ROUTER_MOCK_MODE:-true}
      SMS_MOCK_MODE: ${SMS_MOCK_MODE:-true}
      PAYMENT_MOCK_MODE: ${PAYMENT_MOCK_MODE:-true}
      SEED_DATABASE: ${SEED_DATABASE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mikrotik-network

  worker:
    container_name: mikrotik-billing-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mikrotik_billing}?schema=public
      REDIS_URL: redis://redis:6379
      ROUTER_MOCK_MODE: ${ROUTER_MOCK_MODE:-true}
      SMS_MOCK_MODE: ${SMS_MOCK_MODE:-true}
      PAYMENT_MOCK_MODE: ${PAYMENT_MOCK_MODE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - mikrotik-network

  web:
    container_name: mikrotik-billing-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mikrotik-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  mikrotik-network:
    driver: bridge
