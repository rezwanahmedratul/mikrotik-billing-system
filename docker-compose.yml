services:
  postgres:
    image: postgres:16-alpine
    container_name: mikrotik-billing-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mikrotik_billing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mikrotik_billing}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: mikrotik-billing-redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  api:
    container_name: mikrotik-billing-api
    restart: unless-stopped
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@127.0.0.1:5432/${POSTGRES_DB:-mikrotik_billing}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_development_purposes_only_change_in_production}
      SESSION_SECRET: ${SESSION_SECRET:-super_secret_session_key_for_development_purposes_only}
      ROUTER_MOCK_MODE: ${ROUTER_MOCK_MODE:-true}
      SMS_MOCK_MODE: ${SMS_MOCK_MODE:-true}
      PAYMENT_MOCK_MODE: ${PAYMENT_MOCK_MODE:-true}
      SEED_DATABASE: ${SEED_DATABASE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    container_name: mikrotik-billing-worker
    restart: unless-stopped
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@127.0.0.1:5432/${POSTGRES_DB:-mikrotik_billing}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379}
      ROUTER_MOCK_MODE: ${ROUTER_MOCK_MODE:-true}
      SMS_MOCK_MODE: ${SMS_MOCK_MODE:-true}
      PAYMENT_MOCK_MODE: ${PAYMENT_MOCK_MODE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    container_name: mikrotik-billing-web
    restart: unless-stopped
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
