name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. BUILD STAGE (Runs on GitHub Cloud Runner -> Pushes to GHCR)
  # ============================================================================
  build:
    name: Build & Push Images to GitHub Container Registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          # Lowercase repo name for docker image tagging
          IMAGE_PREFIX=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          echo "========================================================"
          echo "Building & Pushing images to GHCR: ${IMAGE_PREFIX}"
          echo "Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"
          echo "========================================================"

          echo "--- Building & Pushing API Image ---"
          docker build --target api -t ${IMAGE_PREFIX}/api:latest .
          docker push ${IMAGE_PREFIX}/api:latest

          echo "--- Building & Pushing Worker Image ---"
          docker build --target worker -t ${IMAGE_PREFIX}/worker:latest .
          docker push ${IMAGE_PREFIX}/worker:latest

          echo "--- Building & Pushing Web UI Image ---"
          docker build --target web -t ${IMAGE_PREFIX}/web:latest .
          docker push ${IMAGE_PREFIX}/web:latest

          echo "==> All images successfully built and published to GHCR!"

  # ============================================================================
  # 2. DEPLOY STAGE - PRODUCTION (ratul@10.0.0.76 from 'main')
  # ============================================================================
  deploy-production:
    name: Deploy to Production (ratul@10.0.0.76)
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://10.0.0.76:3000
    env:
      TARGET_HOST: "10.0.0.76"
      TARGET_USER: "ratul"
      TARGET_DIR: "/home/ratul/docker/mikrotik-billing-system"
      SSH_OPTS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code on Runner
        uses: actions/checkout@v4

      - name: Ensure Production Directory Exists
        run: |
          ssh ${SSH_OPTS} ${TARGET_USER}@${TARGET_HOST} "mkdir -p ${TARGET_DIR}"

      - name: Transfer Compose Configuration Only (Zero Source Code)
        run: |
          echo "==> Transferring docker-compose.yml and .env.example to Production (${TARGET_HOST})..."
          scp ${SSH_OPTS} docker-compose.yml .env.example ${TARGET_USER}@${TARGET_HOST}:${TARGET_DIR}/

      - name: Pull Images and Launch Production Containers
        run: |
          IMAGE_PREFIX=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "==> Deploying on Production (${TARGET_HOST}) with image prefix: ${IMAGE_PREFIX}..."

          ssh ${SSH_OPTS} ${TARGET_USER}@${TARGET_HOST} "
            set -e
            cd ${TARGET_DIR}

            echo '--- Cleaning up any legacy source code directories ---'
            rm -rf apps packages infrastructure docs screenshots scripts .github Dockerfile tsconfig*.json pnpm-*.yaml

            echo '--- Authenticating with GitHub Container Registry (ghcr.io) ---'
            echo '${GITHUB_TOKEN}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            echo '--- Pulling updated Docker images with layer caching ---'
            docker pull ${IMAGE_PREFIX}/api:latest
            docker pull ${IMAGE_PREFIX}/worker:latest
            docker pull ${IMAGE_PREFIX}/web:latest

            echo '--- Tagging images for Docker Compose ---'
            docker tag ${IMAGE_PREFIX}/api:latest mikrotik-billing-api:latest
            docker tag ${IMAGE_PREFIX}/worker:latest mikrotik-billing-worker:latest
            docker tag ${IMAGE_PREFIX}/web:latest mikrotik-billing-web:latest

            if [ ! -f .env ]; then
              echo 'Creating initial .env from template...'
              cp .env.example .env
            fi

            echo '--- Starting containers via Docker Compose ---'
            docker compose up -d --no-build

            echo '--- Pruning obsolete dangling images ---'
            docker image prune -f

            echo '--- Logging out of ghcr.io ---'
            docker logout ghcr.io || true

            echo '--- Production Container Status ---'
            docker compose ps
          "

      - name: Verify Production API Health Probe
        run: |
          echo "==> Verifying Production API Health Probe..."
          ssh ${SSH_OPTS} ${TARGET_USER}@${TARGET_HOST} "
            echo 'Waiting for production services to initialize...'
            for i in \$(seq 1 15); do
              if curl -s -f http://127.0.0.1:4000/api/v1/health >/dev/null 2>&1; then
                echo 'SUCCESS: Production API is healthy and operational!'
                exit 0
              fi
              echo 'Probing API health (attempt '\$i'/15)...'
              sleep 3
            done
            echo 'WARNING: Health probe timeout; check container logs with: docker compose logs api'
          "

  # ============================================================================
  # 3. DEPLOY STAGE - TESTING (ratul@10.0.0.78 from 'development')
  # ============================================================================
  deploy-testing:
    name: Deploy to Testing (ratul@10.0.0.78)
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15
    if: github.ref == 'refs/heads/development'
    environment:
      name: testing
      url: http://10.0.0.78:3000
    env:
      TARGET_HOST: "10.0.0.78"
      TARGET_USER: "ratul"
      TARGET_DIR: "/home/ratul/docker/mikrotik-billing-system"
      SSH_OPTS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code on Runner
        uses: actions/checkout@v4

      - name: Ensure Testing Directory Exists
        run: |
          ssh ${SSH_OPTS} ${TARGET_USER}@${TARGET_HOST} "mkdir -p ${TARGET_DIR}"

      - name: Transfer Compose Configuration Only (Zero Source Code)
        run: |
          echo "==> Transferring docker-compose.yml and .env.example to Testing (${TARGET_HOST})..."
          scp ${SSH_OPTS} docker-compose.yml .env.example ${TARGET_USER}@${TARGET_HOST}:${TARGET_DIR}/

      - name: Pull Images and Launch Testing Containers
        run: |
          IMAGE_PREFIX=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "==> Deploying to Testing (${TARGET_HOST}) with image prefix: ${IMAGE_PREFIX}..."

          ssh ${SSH_OPTS} ${TARGET_USER}@${TARGET_HOST} "
            set -e
            cd ${TARGET_DIR}

            echo '--- Cleaning up any legacy source code directories ---'
            rm -rf apps packages infrastructure docs screenshots scripts .github Dockerfile tsconfig*.json pnpm-*.yaml

            echo '--- Authenticating with GitHub Container Registry (ghcr.io) ---'
            echo '${GITHUB_TOKEN}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            echo '--- Pulling updated Docker images with layer caching ---'
            docker pull ${IMAGE_PREFIX}/api:latest
            docker pull ${IMAGE_PREFIX}/worker:latest
            docker pull ${IMAGE_PREFIX}/web:latest

            echo '--- Tagging images for Docker Compose ---'
            docker tag ${IMAGE_PREFIX}/api:latest mikrotik-billing-api:latest
            docker tag ${IMAGE_PREFIX}/worker:latest mikrotik-billing-worker:latest
            docker tag ${IMAGE_PREFIX}/web:latest mikrotik-billing-web:latest

            if [ ! -f .env ]; then
              echo 'Creating initial .env from template...'
              cp .env.example .env
            fi

            echo '--- Starting containers via Docker Compose ---'
            docker compose up -d --no-build

            echo '--- Pruning obsolete dangling images ---'
            docker image prune -f

            echo '--- Logging out of ghcr.io ---'
            docker logout ghcr.io || true

            echo '--- Testing Container Status ---'
            docker compose ps
          "

      - name: Verify Testing API Health Probe
        run: |
          echo "==> Verifying Testing API Health Probe..."
          ssh ${SSH_OPTS} ${TARGET_USER}@${TARGET_HOST} "
            echo 'Waiting for testing services to initialize...'
            for i in \$(seq 1 15); do
              if curl -s -f http://127.0.0.1:4000/api/v1/health >/dev/null 2>&1; then
                echo 'SUCCESS: Testing API is healthy and operational!'
                exit 0
              fi
              echo 'Probing API health (attempt '\$i'/15)...'
              sleep 3
            done
            echo 'WARNING: Health probe timeout; check container logs with: docker compose logs api'
          "
