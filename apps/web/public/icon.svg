<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="layerTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#27272A" stroke-width="2"/>
  
  <!-- Layers Graphic -->
  <!-- Top Diamond Layer -->
  <polygon points="32 14, 50 23, 32 32, 14 23" fill="url(#layerTop)" filter="url(#subtleShadow)"/>
  
  <!-- Middle Chevron Layer -->
  <path d="M 14 31 L 32 40 L 50 31" fill="none" stroke="#A1A1AA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom Chevron Layer -->
  <path d="M 14 39 L 32 48 L 50 39" fill="none" stroke="#52525B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
